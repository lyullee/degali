<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Evidence-gated liquid-hydrogen dispersion screening framework</title>
  <desc id="desc">Source, weather and sensor evidence enter a coupled screening workflow. The workflow reports validation metrics, sensor timing and conditional decisions while keeping the regulatory design-basis boundary explicit.</desc>
  <defs>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b4f71"/>
      <stop offset="1" stop-color="#1f87a8"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0d766e"/>
      <stop offset="1" stop-color="#39aa94"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#9a5a08"/>
      <stop offset="1" stop-color="#d28b20"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #334155; }
      .head { font: 700 20px Arial, sans-serif; fill: #ffffff; }
      .body { font: 400 17px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 14px Arial, sans-serif; fill: #334155; }
      .white { font: 400 16px Arial, sans-serif; fill: #ffffff; }
      .box { stroke: #cbd5e1; stroke-width: 2; rx: 18; }
    </style>
  </defs>

  <rect width="1400" height="760" fill="#f8fafc"/>
  <text x="70" y="62" class="title">Evidence-gated LH₂ dispersion screening</text>
  <text x="70" y="95" class="subtitle">Source/weather histories, sensor operators and decision limits remain traceable in one workflow.</text>

  <rect x="60" y="145" width="330" height="430" class="box" fill="#e9f3f7"/>
  <rect x="60" y="145" width="330" height="64" rx="18" fill="url(#blue)"/>
  <text x="85" y="186" class="head">1  Field evidence</text>
  <text x="90" y="255" class="body">Source boundary</text>
  <text x="90" y="283" class="small">location · phase · mass flow</text>
  <text x="90" y="342" class="body">Weather history</text>
  <text x="90" y="370" class="small">speed · direction · height · stability</text>
  <text x="90" y="429" class="body">Receptors and sensors</text>
  <text x="90" y="457" class="small">position · calibration · response · clock</text>
  <text x="90" y="516" class="body">SHA-256 manifest</text>
  <text x="90" y="544" class="small">event ID · operator ID · time alignment</text>

  <line x1="390" y1="360" x2="470" y2="360" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="475" y="145" width="450" height="430" class="box" fill="#e8f6f2"/>
  <rect x="475" y="145" width="450" height="64" rx="18" fill="url(#teal)"/>
  <text x="500" y="186" class="head">2  DEGALI screening core</text>
  <text x="505" y="255" class="body">Common-clock source + wind coupling</text>
  <text x="505" y="286" class="body">Receptor-level observation operator</text>
  <text x="505" y="317" class="body">No-fit LH₂ flashing baseline</text>
  <line x1="505" y1="355" x2="890" y2="355" stroke="#9ccfc4" stroke-width="2"/>
  <text x="505" y="395" class="body">Validated lane</text>
  <text x="505" y="423" class="small">E3.5 peak · synchronised 20 s mean · FFI/DNV</text>
  <text x="505" y="475" class="body">Research extension</text>
  <text x="505" y="503" class="small">3-D transient finite-volume buoyant transport</text>
  <text x="505" y="545" class="small">Numerical convergence ≠ field accuracy</text>

  <line x1="925" y1="360" x2="1005" y2="360" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1010" y="145" width="330" height="430" class="box" fill="#fff5e5"/>
  <rect x="1010" y="145" width="330" height="64" rx="18" fill="url(#amber)"/>
  <text x="1035" y="186" class="head">3  Decision output</text>
  <text x="1040" y="255" class="body">MG · VG · FAC2</text>
  <text x="1040" y="283" class="small">operator-specific validation metrics</text>
  <text x="1040" y="342" class="body">Alarm / arrival / LFL reach</text>
  <text x="1040" y="370" class="small">sensor-aware timing and sensitivity</text>
  <text x="1040" y="429" class="body">accepted · conditional · withheld</text>
  <text x="1040" y="457" class="small">machine-readable evidence gates</text>
  <text x="1040" y="516" class="body">Decision sensitivity</text>
  <text x="1040" y="544" class="small">not a regulatory safety distance</text>

  <rect x="60" y="625" width="1280" height="75" rx="18" fill="#7f1d1d"/>
  <text x="700" y="657" text-anchor="middle" class="head">Explicit boundary: not a substitute for transient multiphase CFD or a standalone design basis</text>
  <text x="700" y="684" text-anchor="middle" class="white">Low-wind Test 6 residuals and missing matched field evidence remain visible.</text>
</svg>
