<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Evidence-gated liquid-hydrogen dispersion screening framework</title>
  <desc id="desc">Source, weather and sensor evidence enter a coupled screening workflow. The workflow reports validation metrics, sensor timing and conditional decisions while keeping the regulatory design-basis boundary explicit.</desc>
  <defs>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b4f71"/>
      <stop offset="1" stop-color="#1f87a8"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0d766e"/>
      <stop offset="1" stop-color="#39aa94"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#9a5a08"/>
      <stop offset="1" stop-color="#d28b20"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #334155; }
      .head { font: 700 19px Arial, sans-serif; fill: #ffffff; }
      .body { font: 600 16px Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 13px Arial, sans-serif; fill: #334155; }
      .white { font: 400 14px Arial, sans-serif; fill: #ffffff; }
      .box { stroke: #cbd5e1; stroke-width: 2; rx: 18; }
    </style>
  </defs>

  <rect width="1400" height="560" fill="#f8fafc"/>
  <text x="70" y="45" class="title">Evidence-gated LH₂ dispersion screening</text>
  <text x="70" y="74" class="subtitle">Source, weather, sensor operators and decision limits remain traceable in one workflow.</text>

  <rect x="60" y="105" width="330" height="320" class="box" fill="#e9f3f7"/>
  <rect x="60" y="105" width="330" height="55" rx="18" fill="url(#blue)"/>
  <text x="85" y="140" class="head">1  Field evidence</text>
  <text x="90" y="198" class="body">Source boundary</text>
  <text x="90" y="221" class="small">location · phase · mass flow</text>
  <text x="90" y="263" class="body">Weather history</text>
  <text x="90" y="286" class="small">speed · direction · height · stability</text>
  <text x="90" y="328" class="body">Geometry + sensors</text>
  <text x="90" y="351" class="small">obstacles · receptors · calibration · clock</text>
  <text x="90" y="393" class="body">SHA-256 manifest</text>
  <text x="90" y="416" class="small">event ID · operator ID · alignment</text>

  <line x1="390" y1="265" x2="470" y2="265" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="475" y="105" width="450" height="320" class="box" fill="#e8f6f2"/>
  <rect x="475" y="105" width="450" height="55" rx="18" fill="url(#teal)"/>
  <text x="500" y="140" class="head">2  DEGALI screening core</text>
  <text x="505" y="198" class="body">No-fit LH₂ flashing baseline</text>
  <text x="505" y="226" class="body">Receptor observation operator</text>
  <text x="505" y="254" class="body">Common-clock source + wind</text>
  <line x1="505" y1="278" x2="890" y2="278" stroke="#9ccfc4" stroke-width="2"/>
  <text x="505" y="310" class="body">Outdoor: MG 1.047 · FAC2 0.839</text>
  <text x="505" y="337" class="small">62 PRESLHY E3.5 arc maxima</text>
  <text x="505" y="373" class="body">Dynamic: MAE 0.282 vol%p</text>
  <text x="505" y="400" class="small">three frozen GH₂ enclosure holdouts</text>
  <text x="505" y="419" class="small">Numerical convergence ≠ field accuracy</text>

  <line x1="925" y1="265" x2="1005" y2="265" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1010" y="105" width="330" height="320" class="box" fill="#fff5e5"/>
  <rect x="1010" y="105" width="330" height="55" rx="18" fill="url(#amber)"/>
  <text x="1035" y="140" class="head">3  Decision output</text>
  <text x="1040" y="205" class="body">qualified</text>
  <text x="1040" y="239" class="body">conditional</text>
  <text x="1040" y="273" class="body">withheld</text>
  <text x="1040" y="316" class="small">operator-specific metrics</text>
  <text x="1040" y="342" class="small">alarm · arrival · LFL reach</text>
  <text x="1040" y="381" class="body">Escalate to CFD</text>
  <text x="1040" y="405" class="small">when geometry/transience controls</text>

  <rect x="60" y="465" width="1280" height="65" rx="18" fill="#7f1d1d"/>
  <text x="700" y="491" text-anchor="middle" class="head">Explicit boundary: screening—not a standalone regulatory design basis</text>
  <text x="700" y="516" text-anchor="middle" class="white">Low-wind Test 6 residuals and unmatched site geometry remain visible.</text>
</svg>
