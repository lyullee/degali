name: publish release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag and release version
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          text = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          version = re.search(
              r'^version\s*=\s*["\']([^"\']+)',
              text.split("[project]", 1)[1],
              re.MULTILINE,
          ).group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          if version.endswith(".dev0"):
              raise SystemExit("refusing to publish a development version")
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match version v{version}")
          print(f"release version: {version}")
          PY

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade build twine
          python tools/check_publication.py
          python -m build
          python -m twine check dist/*

      - name: Upload release distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/degali
    permissions:
      id-token: write

    steps:
      - name: Download release distributions
        uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist/

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
